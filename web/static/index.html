<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sitemap Extractor</title>
  <meta name="description" content="Extract article URLs from any XML sitemap and download them as CSV.">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="top">
    <div class="wrap top-row">
      <span class="brand">Sitemap Extractor</span>
      <button type="button" id="lang-toggle" class="link-btn" aria-label="Switch language">English</button>
    </div>
  </header>

  <main class="wrap">
    <h1 data-i18n="title"></h1>
    <p class="lead" data-i18n="lead"></p>

    <form id="form" class="card">
      <label for="inputs" class="label" data-i18n="inputLabel"></label>
      <textarea id="inputs" rows="4" spellcheck="false" autocomplete="off"
                placeholder="https://example.com/sitemap.xml"></textarea>
      <p class="hint" id="input-hint"></p>

      <details id="advanced">
        <summary data-i18n="advanced"></summary>
        <div class="adv-body">
          <fieldset>
            <legend data-i18n="typesLegend"></legend>
            <div class="checks" id="type-checks"></div>
          </fieldset>

          <div class="grid2">
            <div>
              <label for="include" class="label" data-i18n="includeLabel"></label>
              <input id="include" type="text" autocomplete="off" placeholder="/blog/">
            </div>
            <div>
              <label for="exclude" class="label" data-i18n="excludeLabel"></label>
              <input id="exclude" type="text" autocomplete="off" placeholder="/tag/, /en/">
            </div>
          </div>
          <p class="hint" data-i18n="keywordHint"></p>

          <div class="grid2">
            <div>
              <label for="date-from" class="label" data-i18n="dateFrom"></label>
              <input id="date-from" type="date">
            </div>
            <div>
              <label for="date-to" class="label" data-i18n="dateTo"></label>
              <input id="date-to" type="date">
            </div>
          </div>
          <p class="hint" data-i18n="dateHint"></p>

          <fieldset>
            <legend data-i18n="outputLegend"></legend>
            <div class="checks">
              <label><input type="radio" name="split" value="merged" checked> <span data-i18n="merged"></span></label>
              <label><input type="radio" name="split" value="split"> <span data-i18n="split"></span></label>
            </div>
          </fieldset>

          <fieldset id="sources-box" hidden>
            <legend data-i18n="sourcesLegend"></legend>
            <div class="row-actions">
              <button type="button" class="link-btn" id="sources-all" data-i18n="selectAll"></button>
              <button type="button" class="link-btn" id="sources-none" data-i18n="selectNone"></button>
            </div>
            <div class="sources" id="sources"></div>
          </fieldset>
        </div>
      </details>

      <div class="actions">
        <button type="submit" id="submit" class="primary" data-i18n="submit"></button>
        <button type="button" id="cancel" class="secondary" data-i18n="cancel" hidden></button>
      </div>
    </form>

    <section id="progress-box" class="card" hidden aria-live="polite">
      <p id="progress-text" class="progress-text"></p>
      <progress id="progress-bar" max="1" value="0"></progress>
    </section>

    <p id="message" class="alert" role="alert" hidden></p>

    <section id="result-box" class="card" hidden>
      <h2 id="result-count" aria-live="polite"></h2>
      <p id="result-notice" class="notice" hidden></p>
      <p id="truncated" class="notice" hidden></p>
      <div class="actions">
        <button type="button" id="download-csv" class="primary" data-i18n="downloadCsv"></button>
        <button type="button" id="copy-all" class="secondary" data-i18n="copyAll"></button>
        <button type="button" id="download-txt" class="secondary" data-i18n="downloadTxt"></button>
        <span id="copied" class="copied" hidden data-i18n="copied"></span>
      </div>

      <details id="errors-box" hidden>
        <summary id="errors-summary"></summary>
        <ul id="errors" class="errors"></ul>
      </details>

      <p id="preview-note" class="hint"></p>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th data-i18n="colUrl"></th>
              <th data-i18n="colLastmod"></th>
              <th data-i18n="colType"></th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer class="wrap foot">
    <span data-i18n="footer"></span>
    <a href="https://github.com/AndyWei1123/sitemap-extractor" target="_blank" rel="noopener noreferrer" data-i18n="source"></a>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
